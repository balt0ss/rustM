name: Build ErebusRust APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ErebusRust.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ErebusRust.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repository root"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

          if [ ! -f project/Erebus/app/build.gradle.kts ]; then
            echo "ERROR: Expected project/Erebus/app/build.gradle.kts"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project/Erebus
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PmsClientId="${MS_CLIENT_ID:-}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Erebus-debug
          path: project/Erebus/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
