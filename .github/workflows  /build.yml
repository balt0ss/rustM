
name: Build ErebusRust APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ErebusRust.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: erebusrust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ErebusRust.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ErebusRust.zip not found"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

          test -f project/Erebus/settings.gradle.kts
          test -f project/Erebus/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Rustup
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project/Erebus
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PmsClientId="${MS_CLIENT_ID:-}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ErebusRust-debug-arm64
          path: project/Erebus/app/build/outputs/apk/debug/ErebusRust.apk
          if-no-files-found: error
          retention-days: 14
